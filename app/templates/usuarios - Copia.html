<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Usuários - Padaria System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-12 text-start">
                <div class="d-inline-flex" style="gap: 10px;">
                    <a href="/dashboard" class="btn btn-secondary">Voltar</a>
                </div>
            </div>
        </div>
<div class="container mt-4">
    <h2 class="mb-4 text-center">Gestão de Usuários</h2>

    <!-- Filtro -->
    <div class="row mb-3">
        <div class="col-md-6">
            <input type="text" id="filtroUsuario" class="form-control" placeholder="Pesquisar por Nome ou Email" oninput="buscarUsuarios()">
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-success" onclick="abrirModalUsuario()">Incluir <i class="fas fa-user-plus"></i></button>
        </div>
    </div>

    <!-- Tabela de Usuários -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Loja</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaUsuarios">
            <!-- Conteúdo gerado via JS -->
        </tbody>
    </table>
</div>

<!-- Modal de Cadastro/Edição -->
<div id="modalUsuarioContainer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let lojasCache = [];
let usuarioEditando = null; // Para saber se é inclusão ou edição

async function carregarLojas() {
    const response = await fetch('/api/lojas');
    const lojas = await response.json();
    lojasCache = lojas;
}

async function buscarUsuarios() {
    const filtro = document.getElementById('filtroUsuario').value.trim();

    const response = await fetch('/api/usuarios/consulta', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ filtro })
    });

    const usuarios = await response.json();
    const tabela = document.getElementById('tabelaUsuarios');
    tabela.innerHTML = '';

    usuarios.forEach(usuario => {
        const linha = `
            <tr>
                <td>${usuario.nome}</td>
                <td>${usuario.email}</td>
                <td>${usuario.loja || ''}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="abrirModalUsuario(${usuario.id})">
                        <i class="fas fa-edit"></i> Editar
                    </button>
                </td>
            </tr>
        `;
        tabela.innerHTML += linha;
    });
}

function abrirModalUsuario(idUsuario = null) {
    usuarioEditando = idUsuario;

    let titulo = idUsuario ? 'Editar Usuário' : 'Novo Usuário';

    let lojasOptions = lojasCache.map(loja => `
        <option value="${loja.id}">${loja.descricao}</option>
    `).join('');

    const modalHtml = `
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalUsuarioLabel">${titulo}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="nomeUsuario" class="form-label">Nome</label>
                        <input type="text" id="nomeUsuario" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="emailUsuario" class="form-label">Email</label>
                        <input type="email" id="emailUsuario" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="senhaUsuario" class="form-label">Senha</label>
                        <input type="password" id="senhaUsuario" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="lojaUsuario" class="form-label">Loja</label>
                        <select id="lojaUsuario" class="form-select">
                            <option value="">Selecione</option>
                            ${lojasOptions}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="salvarUsuario()">Salvar</button>
                </div>
            </div>
        </div>
    </div>
    `;

    document.getElementById('modalUsuarioContainer').innerHTML = modalHtml;
    const modal = new bootstrap.Modal(document.getElementById('modalUsuario'));
    modal.show();

    if (idUsuario) {
        carregarDadosUsuario(idUsuario);
    }
}

async function carregarDadosUsuario(idUsuario) {
    const response = await fetch(`/api/usuarios/${idUsuario}`);
    const usuario = await response.json();

    document.getElementById('nomeUsuario').value = usuario.nome;
    document.getElementById('emailUsuario').value = usuario.email;
    document.getElementById('lojaUsuario').value = usuario.id_loja;
}

async function salvarUsuario() {
    const nome = document.getElementById('nomeUsuario').value.trim();
    const email = document.getElementById('emailUsuario').value.trim();
    const senha = document.getElementById('senhaUsuario').value.trim();
    const id_loja = document.getElementById('lojaUsuario').value;

    if (!nome || !email || (!usuarioEditando && !senha) || !id_loja) {
        alert('Preencha todos os campos obrigatórios.');
        return;
    }

    const payload = { nome, email, senha, id_loja };

    const url = usuarioEditando ? `/api/usuarios/editar/${usuarioEditando}` : '/api/usuarios/novo';
    const method = usuarioEditando ? 'PUT' : 'POST';

    const response = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    if (response.ok) {
        alert('Usuário salvo com sucesso!');
        const modal = bootstrap.Modal.getInstance(document.getElementById('modalUsuario'));
        modal.hide();
        buscarUsuarios();
    } else {
        alert('Erro ao salvar usuário.');
    }
}

// Ao abrir a página
window.onload = async function() {
    await carregarLojas();
    buscarUsuarios();
}
</script>

</body>
</html>
