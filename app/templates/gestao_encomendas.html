<script>
function formatarQuantidade(qtd) {
    // Garante que é número
    let n = Number(qtd);
    // Se é inteiro, mostra sem casas decimais
    if (Number.isInteger(n)) {
        return n.toString();
    }
    // Se tem casas decimais, mostra com vírgula e duas casas
    return n.toFixed(2).replace('.', ',');
}

let clientesCache = [];
async function carregarClientes() {
    const response = await fetch('/api/clientes');
    const clientes = await response.json();
    clientesCache = clientes.map(c => ({
        ...c,
        nome_normalizado: c.nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    }));
}
function formatarDataHora(dataIso) {
    if (!dataIso) return "";
    const d = new Date(dataIso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
}

function formatarData(dataIso) {
    if (!dataIso) return "";
    const partes = dataIso.split("-");
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


$(document).ready(function () {
    carregarLojas();
    carregarStatus();
    carregarClientes();

    $('#cliente').on('input', function () {
        if (clientesCache.length === 0) return;

        let buscaOriginal = $(this).val();
        let busca = buscaOriginal.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        let buscaNumerica = buscaOriginal.replace(/\D/g, '');

        if (buscaOriginal.trim() === "") {
            $('#id_cliente_real').val('');
            $('#sugestoes-clientes').empty();
            return;
        }

        if (busca.length < 3 && buscaNumerica.length < 3) {
            $('#sugestoes-clientes').empty();
            return;
        }

        let sugestoesFiltradas = clientesCache.filter(c => {
            const telefoneLimpo = c.telefone.replace(/\D/g, '');
            return busca && c.nome_normalizado.includes(busca) || buscaNumerica && telefoneLimpo.includes(buscaNumerica);
        }).slice(0, 10);

        $('#sugestoes-clientes').empty();
        sugestoesFiltradas.forEach(c => {
            $('#sugestoes-clientes').append(`<button type="button" class="list-group-item list-group-item-action" data-id="${c.id}" data-nome="${c.nome}">${c.nome} - ${c.telefone}</button>`);
        });
    });

    $('#sugestoes-clientes').on('click', 'button', function () {
        const idCliente = $(this).data('id');
        const nomeCliente = $(this).data('nome');
        $('#cliente').val(nomeCliente);
        $('#id_cliente_real').val(idCliente);
        $('#sugestoes-clientes').empty();
    });
});

async function carregarLojas() {
    const response = await fetch('/api/lojas');
    const lojas = await response.json();
    const select = document.getElementById('loja');
    select.innerHTML = '<option value="">Todas</option>';
    lojas.forEach(loja => {
        const option = document.createElement('option');
        option.value = loja.id;
        option.textContent = loja.descricao;
        select.appendChild(option);
    });
}
async function carregarStatus() {
    const response = await fetch('/api/status');
    const status = await response.json();
    const select = document.getElementById('status');
    select.innerHTML = '<option value="">Todos</option>';
    status.forEach(s => {
        const option = document.createElement('option');
        option.value = s.id;
        option.textContent = s.descricao;
        select.appendChild(option);
    });
}

function criarCardHtml(pedido) {
    const hoje = new Date();
    hoje.setHours(0,0,0,0);

    const dataEntrega = new Date(pedido.data_entrega);
    let faixa = '';

    if (pedido.data_entrega === new Date().toISOString().split('T')[0]) {
        faixa = '<span class="badge bg-success">HOJE</span>';
    } else if (dataEntrega < hoje) {
        faixa = '<span class="badge bg-danger">ATRASADO</span>';
    }

    const valorTotalFormatado = (pedido.valor_total || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    });

    const itensHtml = (pedido.itens || []).map(item => `
        <li class="text-break">
            📋 ${formatarQuantidade(item.quantidade_un)} UN - ${item.descricao}
            ${item.desc_produto_associado ? ' - ' + item.desc_produto_associado : ''}
            ${item.observacao ? ' (<em>' + item.observacao + '</em>)' : ''}
        </li>
    `).join('');

    const enderecoHtml = pedido.tipo_entrega === 'entrega'
        ? `<p><strong>Endereço:</strong> ${pedido.endereco || ''}</p>`
        : '';

    const mostrarBotoes = pedido.id_status !== 7;

    const btnFinalizar = pedido.impresso && mostrarBotoes
        ? `<button class="btn botao-finalizar" onclick="escolherSistemaFinalizacao(${pedido.id}, ${pedido.impresso})">Finalizar</button>`
        : '';

    const btnStatus = mostrarBotoes
        ? `<button class="btn botao-status" onclick="abrirModalStatus(${pedido.id})">Status</button>`
        : '';

    const infoFinalizado = pedido.data_finalizacao ? `
        <p>
            <i class="bi bi-check2-circle"></i> Finalizado em:
            ${formatarDataHora(pedido.data_finalizacao)}<br>
            <span style="font-size:1.3em">${compararDatasIso(pedido.data_finalizacao, pedido.data_entrega)}</span>
        </p>
    ` : '';

    return `
        <div class="col-md-4" id="pedido-${pedido.id}">
            <div class="card-pedido">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div><span class="badge bg-primary">Pedido #${pedido.id}</span></div>
                    <div><i class="bi bi-clock"></i> ${formatarDataHora(pedido.data_pedido)}</div>
                </div>

                ${pedido.impresso
                    ? `<span class="badge bg-success"><i class="bi bi-printer"></i> Impresso</span>`
                    : `<span class="badge bg-secondary"><i class="bi bi-printer"></i> Não impresso</span>`}

                <p><i class="bi bi-shop"></i> ${pedido.nome_loja || ''}</p>
                <p><i class="bi bi-person"></i> ${pedido.nome_cliente || ''} - ${pedido.telefone || ''}</p>

                <p><strong>Tipo Entrega:</strong> ${(pedido.tipo_entrega || '').toUpperCase()}</p>

                ${enderecoHtml}

                <p><strong>Status Atual:</strong> ${pedido.status_descricao || ''}</p>

                ${pedido.observacoes ? `<p><strong>Observação:</strong> ${pedido.observacoes}</p>` : ''}

                <ul>${itensHtml}</ul>

                <hr>

                <p><i class="bi bi-calendar-event"></i>
                    Entrega: ${formatarData(pedido.data_entrega)} -
                    ${diaSemanaExtenso(pedido.data_entrega)}
                </p>

                <p><strong>Hora Entrega:</strong> ${pedido.hora_entrega || ''} ${!pedido.data_finalizacao ? faixa : ''}</p>

                ${infoFinalizado}

                <p><strong>Valor Total:</strong> ${valorTotalFormatado}</p>

                <div class="botoes">
                    ${btnStatus}
                    ${btnFinalizar}
                    <button class="btn btn-success btn-sm"
                        onclick="imprimirPedido(${pedido.id})">
                        Imprimir
                    </button>
                </div>
            </div>
        </div>
    `;
}

let pedidosCache = [];

function renderPedidos(pedidos) {
    const cont = $('#cards-container');
    if (!pedidos.length) {
        cont.html('<p class="text-center">Nenhum pedido encontrado.</p>');
        pedidosCache = [];
        return;
    }
    const idsNovos = new Set();
    pedidos.forEach(pedido => {
        idsNovos.add(pedido.id);
        const htmlNovo = criarCardHtml(pedido);
        const cardExistente = $('#pedido-' + pedido.id);
        const pedidoAntigo = pedidosCache.find(p => p.id === pedido.id);
        if (!cardExistente.length) {
            cont.append(htmlNovo);
        } else if (JSON.stringify(pedidoAntigo) !== JSON.stringify(pedido)) {
            cardExistente.replaceWith(htmlNovo);
        }
    });
    pedidosCache.forEach(pedido => {
        if (!idsNovos.has(pedido.id)) {
            $('#pedido-' + pedido.id).remove();
        }
    });
    pedidosCache = structuredClone(pedidos);
}

function normalizarTexto(s) {
  return String(s || '')
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, ""); // remove acentos
}

function montarTextoPesquisa(p) {
  const blocos = [];

  // campos diretos
  blocos.push(p.id);
  blocos.push(p.nome_cliente);
  blocos.push(p.telefone);
  blocos.push(p.nome_loja);
  blocos.push(p.tipo_entrega);
  blocos.push(p.status_descricao);
  blocos.push(p.observacoes);
  blocos.push(p.endereco);
  blocos.push(p.hora_entrega);
  blocos.push(p.data_entrega);
  blocos.push(p.data_pedido);

  // itens (descrição + observação do item + produto associado)
  (p.itens || []).forEach(it => {
    blocos.push(it.descricao);
    blocos.push(it.observacao);
    blocos.push(it.desc_produto_associado);
  });

  // junte tudo como um “documento” do pedido
  return normalizarTexto(blocos.filter(Boolean).join(' | '));
}

// debounce simples para não re-renderizar a cada tecla
function debounce(fn, ms) {
  let t; 
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

const onBuscaLivre = debounce(() => {
  const q = normalizarTexto($('#busca_livre').val() || '');

  if (!q) {
    // sem termo → mostra tudo (já ordenado do último fetch)
    renderPedidos(pedidosCache);
    return;
  }

  const filtrados = pedidosCache.filter(p => {
    // índice pré-computado acelera:
    if (!p._idx) p._idx = montarTextoPesquisa(p);
    return p._idx.includes(q);
  });

  renderPedidos(filtrados);
}, 120);

// ative o listener quando a página carrega
$(document).ready(function () {
  // ... seus carregamentos já existentes
  $('#busca_livre').on('input', onBuscaLivre);
});

// Helpers mais robustos (DATA → número)
function toYmdNumber(v) {
  if (!v) return -Infinity; // sem data vai para o começo no ASC
  // aceita "YYYY-MM-DD" ou "YYYY-MM-DDTHH:MM:SS"
  const ymd = String(v).split('T')[0].trim();
  const [Y, M, D] = ymd.split('-').map(n => parseInt(n, 10));
  if (!Y || !M || !D) return -Infinity;
  return (Y * 10000) + (M * 100) + D; // número comparável
}

// PESO DE HORÁRIO (inteiro): HH*100 + MM
function horaPesoInt(val) {
  if (val == null) return Number.MAX_SAFE_INTEGER; // sem hora vai pro fim
  const s = String(val).trim();

  // "H:MM" / "HH:MM" / "HH:MM:SS"
  const m1 = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  if (m1) {
    const h = parseInt(m1[1], 10) || 0;
    const m = parseInt(m1[2], 10) || 0;
    return (h * 100) + m; // 06:30 -> 630, 09:15 -> 915
  }

  // "HMM" / "HHMM" (ex.: "905", "0905", "1430")
  if (/^\d{3,4}$/.test(s)) {
    const pad = s.padStart(4, '0');
    const h = parseInt(pad.slice(0, 2), 10) || 0;
    const m = parseInt(pad.slice(2, 4), 10) || 0;
    return (h * 100) + m;
  }

  // formato inesperado
  return Number.MAX_SAFE_INTEGER;
}

// ===== ORDENAR =====
pedidos.sort((a, b) => {
  const ordenarPor = document.getElementById('ordenar_por').value;
  const ordem = document.getElementById('ordem').value; // 'asc' | 'desc'
  const dir = (ordem === 'asc') ? 1 : -1;

  // por número (id)
  if (ordenarPor === 'numero') {
    return ((a.id || 0) - (b.id || 0)) * dir;
  }

  // por data (pedido/entrega)
  const campoData = (ordenarPor === 'data_pedido') ? 'data_pedido' : 'data_entrega';

  // 1) compara DATA conforme direção selecionada
  const da = toYmdNumber(a[campoData]);
  const db = toYmdNumber(b[campoData]);
  if (da !== db) return (da < db ? -1 : 1) * dir;

  // 2) MESMA DATA → usa PESO DO HORÁRIO (sempre crescente no mesmo dia)
  const pa = horaPesoInt(a.hora_entrega);
  const pb = horaPesoInt(b.hora_entrega);
  if (pa !== pb) return pa - pb;
  // (se preferir que DESC também reverta o horário, troque por: return (pa - pb) * dir;)

  // 3) desempate por id ascendente (estável)
  return (a.id || 0) - (b.id || 0);
});

function adicionarEtiquetaMulti() {
  if (!_multiCtx) return;
  const input = document.getElementById('multiEtiquetaInput');
  const etiqueta = (input?.value || '').trim();
  if (!etiqueta) return;

  // usa a MESMA validação já existente
  const r = validarEtiquetaBalança(etiqueta, _multiCtx.codInterno, _multiCtx.precoVendaKg);
  if (r.erro) {
    alert(r.erro);
    input.select();
    return;
  }

  _multiCtx.lista.push({ raw: etiqueta, kg: r.quantidadeKg });
  input.value = '';
  renderMultiLista();
}

function renderMultiLista() {
  if (!_multiCtx) return;

  const tbody = document.getElementById('multiEtiquetasTbody');
  const rows = _multiCtx.lista.map((it, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${it.raw}</td>
      <td>${formatarQuantidade(it.kg)}</td>
      <td class="text-center">
        <button class="btn btn-sm btn-outline-danger" onclick="removerEtiquetaMulti(${i})">&times;</button>
      </td>
    </tr>
  `).join('');
  tbody.innerHTML = rows || `<tr><td colspan="4" class="text-center text-muted">Nenhuma etiqueta adicionada</td></tr>`;

  const qtd = _multiCtx.lista.length;
  const totalKg = _multiCtx.lista.reduce((acc, it) => acc + (parseFloat(it.kg) || 0), 0);

  document.getElementById('multiQtdEtiquetas').textContent = String(qtd);
  document.getElementById('multiTotalKg').textContent = formatarQuantidade(totalKg);
}

function removerEtiquetaMulti(idx) {
  if (!_multiCtx) return;
  _multiCtx.lista.splice(idx, 1);
  renderMultiLista();
}

function limparEtiquetasMulti() {
  if (!_multiCtx) return;
  if (!confirm('Deseja limpar todas as etiquetas desta lista?')) return;
  _multiCtx.lista = [];
  renderMultiLista();
}

function salvarMultiEtiquetas() {
  if (!_multiCtx) return;
  // soma total em kg
  const totalKg = _multiCtx.lista.reduce((acc, it) => acc + (parseFloat(it.kg) || 0), 0);

  // grava na linha original
  const linha = _multiCtx.linha;
  const campoQtd = linha.querySelector('.quantidade');
  if (campoQtd) {
    campoQtd.value = (Math.round(totalKg * 1000) / 1000); // 3 casas
    // dispara change para recalcular total da linha / pedido
    campoQtd.dispatchEvent(new Event('change'));
  }

  // persiste a lista na linha (reabrir depois)
  linha.dataset.multiEtiquetas = JSON.stringify(_multiCtx.lista);

  // fecha modal
  const m = bootstrap.Modal.getInstance(document.getElementById('modalMultiEtiquetas'));
  if (m) m.hide();
  _multiCtx = null;
}

function safeParseJson(s) {
  try { return s ? JSON.parse(s) : null; } catch (_) { return null; }

function atualizarValorTotalFinalizar(input) {

function atualizarValorTotalPedidoFinalizar() {
    let totalPedido = 0;

        const precoVenda = parseFloat(linha.querySelectorAll('td')[4].innerText.replace('R$', '').replace('.', '').replace(',', '.'));

// Utilitário: carrega lojas para o select do modal (reaproveita /api/lojas)
async function carregarLojasModalGE() {
  const sel = document.getElementById('cfgLojaGE');
  sel.innerHTML = '<option value="">Selecione a Loja</option>';
  try {
    const r = await fetch('/api/lojas');
    const lojas = await r.json();
    lojas.forEach(loja => {
      const opt = document.createElement('option');
      opt.value = loja.id;
      opt.textContent = loja.descricao;
      sel.appendChild(opt);
    });

// Abre modal: preenche lojas e tenta pré-selecionar a loja do filtro da tela
async function abrirModalImpressora() {
  await carregarLojasModalGE();

  const filtroLoja = document.getElementById('loja')?.value || '';
  const sel = document.getElementById('cfgLojaGE');
  if (filtroLoja) sel.value = filtroLoja;

  // Busca caminho para a loja selecionada com id_setor = null
  await buscarCaminhoImpressoraPorLojaGE();

  // Ao trocar a loja no modal, recarrega o caminho
  sel.onchange = buscarCaminhoImpressoraPorLojaGE;

  const modal = new bootstrap.Modal(document.getElementById('modalImpressora'));
  modal.show();
}

// GET no mesmo endpoint do KDS, com setor vazio => id_setor = null no backend
async function buscarCaminhoImpressoraPorLojaGE() {
  const lojaId = document.getElementById('cfgLojaGE').value;
  const input = document.getElementById('caminhoImpressora');

  if (!lojaId) {
    input.value = '';
    input.placeholder = '\\\\SERVIDOR\\IMP_TERMICA';
    return;
  }

  try {
    // importante: setor vazio na querystring
    const r = await fetch(`/api/impressora/setor?loja=${lojaId}&setor=`);
    const j = await r.json();
    input.value = j.caminho_impressora || '';
    if (!input.value) input.placeholder = '\\\\SERVIDOR\\IMP_TERMICA';
  } catch {
    input.value = '';
    input.placeholder = '\\\\SERVIDOR\\IMP_TERMICA';
  }
}

// Salva caminho para a loja escolhida com id_setor = null
async function salvarCaminhoImpressora() {
  const lojaId = document.getElementById('cfgLojaGE').value;
  const caminho = document.getElementById('caminhoImpressora').value.trim();

  if (!lojaId) {
    alert('Selecione a Loja.');
    return;
  }
  if (!caminho) {
    alert('Informe o caminho da impressora.');
    return;
  }

  try {
    const r = await fetch('/api/impressora/setor', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        id_loja: Number(lojaId),
        id_setor: null,                  // <- chave: setor nulo para Gestão de Encomendas
        caminho_impressora: caminho
      })
    });
    const j = await r.json();
    if (j.ok || j.sucesso) {
      alert('Configuração salva!');
      const modal = bootstrap.Modal.getInstance(document.getElementById('modalImpressora'));
      modal && modal.hide();
    } else {
      alert(j.erro || 'Erro ao salvar caminho da impressora.');
    }
  } catch (e) {
    console.error(e);
    alert('Erro ao salvar caminho da impressora.');
  }
}

function diaSemanaExtenso(dataIso) {
    if (!dataIso) return "";
    const dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    // Garante que a data seja tratada como local
    let partes = dataIso.split('-');
    // Cuidado: meses no JS começam do 0!
    let d = new Date(partes[0], partes[1] - 1, partes[2]);
    return dias[d.getDay()];
}
async function salvarFinalizacaoPedido(idPedido) {
    const numeroFicha = document.getElementById('numeroFicha').value.trim();

    if (!numeroFicha) {
        alert("Por favor, digite o número da ficha.");
        return;
    }

    // Pega itens atualizados
    const linhas = document.querySelectorAll('#itensFinalizar tr');
    const itensAtualizados = [];

    linhas.forEach(linha => {
        const idProduto = linha.getAttribute('data-id-produto');
        const quantidade = parseFloat(linha.querySelector('.quantidade').value) || 0;
        const quantidadeUn = Math.round(quantidade);

        itensAtualizados.push({
            cod_produto: idProduto,
            quantidade: quantidade,        // Salvar com decimal
            quantidade_un: quantidadeUn     // Salvar inteiro
        });
    });

    try {
        const response = await fetch('/api/encomenda/finalizar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                id_pedido: idPedido,
                numero_ficha: numeroFicha,
                itens: itensAtualizados
            })
        });

        const resultado = await response.json();

        if (response.ok) {
            alert('Pedido finalizado com sucesso!');
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalFinalizar'));
            modal.hide();
            pesquisarEncomendas(); // Recarrega a tela
        } else {
            alert('Erro ao finalizar pedido: ' + (resultado.erro || ''));
        }
    } catch (error) {
        console.error('Erro ao finalizar pedido:', error);
        alert('Erro ao finalizar pedido.');
    }
}
function compararDatasIso(dataFinalizacao, dataEntrega) {
    if (!dataFinalizacao || !dataEntrega) return "";
    let dFinal = new Date(dataFinalizacao.split("T")[0]);
    let dEntrega = new Date(dataEntrega.split("T")[0]);
    if (dFinal > dEntrega) return "☹️ Em atraso";
    else return "🙂 Dentro do prazo";
}

function abrirCampoEtiqueta(btn, codInterno, precoVendaKg) {
    const divCampo = btn.closest('td').querySelector('.campo-etiqueta');
    divCampo.classList.toggle('d-none');
    divCampo.querySelector('.etiqueta-input').focus();
}

function lerEtiquetaBalança(input, codInterno, precoVendaKg) {
    const codigoEtiqueta = input.value.trim();
    const div = input.closest('.campo-etiqueta');
    const erroElem = div.querySelector('.etiqueta-erro');

    const resultado = validarEtiquetaBalança(codigoEtiqueta, codInterno, precoVendaKg);
    if (resultado.erro) {
        erroElem.textContent = resultado.erro;
        return;
    }
    erroElem.textContent = '';

    // Preenche o campo de quantidade na linha
    const linha = input.closest('tr');
    const campoQtd = linha.querySelector('.quantidade');
    campoQtd.value = resultado.quantidadeKg;

    // Dispara o evento para atualizar o valor total
    campoQtd.dispatchEvent(new Event('change'));

    // Fecha o campo etiqueta e limpa o input
    div.classList.add('d-none');
    input.value = '';
}
function validarEtiquetaBalança(codigoEtiqueta, codInternoEsperado, precoVendaKg) {
  // remove apenas o "_" inicial (se existir) e espaços de borda
  const raw = String(codigoEtiqueta || '').trim();
  const s = raw.charAt(0) === '_' ? raw.slice(1) : raw;

  // mantém as mesmas posições que já funcionavam:
  // código: 2..5  |  preço: 8..12
  if (s.length < 13) return { erro: "Etiqueta inválida!" };

  const codigoInterno    = s.substr(1, 4); // posições 2 a 5
  const precoEtiquetaStr = s.substr(7, 5); // posições 8 a 12

  const precoEtiqueta   = parseInt(precoEtiquetaStr, 10) / 100; // 01965 -> 19.65
  const codInternoLimpo = codigoInterno.replace(/^0+/, '');

  if (codInternoLimpo !== String(codInternoEsperado)) {
    return { erro: "Código interno diferente do pedido!" };
  }

  const quantidadeKg = +(precoEtiqueta / precoVendaKg).toFixed(3);
  return { quantidadeKg, precoEtiqueta };
}
