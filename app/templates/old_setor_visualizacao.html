<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>KDS - Visualização de Setores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }
        .descricao {
            font-size: 24px;
            font-weight: bold;
        }
        .quantidade {
            font-size: 20px;
            margin-top: 10px;
        }
        .observacao {
            font-size: 14px;
            color: gray;
            margin-top: 5px;
        }
        .faixa-verde {
            background-color: #4CAF50;
            color: white;
            padding: 5px;
            font-weight: bold;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .faixa-azul {
            background-color: #2196F3;
            color: white;
            padding: 5px;
            font-weight: bold;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
        .faixa-roxa {
            background-color: #9C27B0;
            color: white;
            padding: 5px;
            font-weight: bold;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4 text-center">Gestão de Pedidos</h2>

    <!-- Filtros -->
    <div class="row mb-4">
        <div class="col-md-5">
            <select id="lojaSelect" class="form-select">
                <option value="">Selecione a Loja</option>
            </select>
        </div>
        <div class="col-md-5">
            <select id="setorSelect" class="form-select">
                <option value="">Selecione o Setor</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" onclick="forcarAtualizacao()">Atualizar</button>
        </div>
    </div>

<!-- Layout Principal -->
<div class="row">
  
  <!-- Faixa Esquerda (Novidades) -->
  <div class="col-md-3">
    <h5>Produtos Acrescentados</h5>
    <div id="produtosAcrescentados" class="mb-5"></div>

    <h5>Produtos Novos</h5>
    <div id="produtosNovos"></div>
  </div>

  <!-- Cards à Direita (Pedidos Atuais) -->
  <div class="col-md-9">
    <h4>Pedidos Atuais</h4>
    <div id="pedidosContainer" class="row g-3"></div>
  </div>

</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let estadoPedidos = {};  // Histórico para comparar mudanças
let novidades = {};      // Novidades para mostrar faixa azul ou verde

// Carrega lojas e setores
async function carregarFiltros() {
    document.getElementById('lojaSelect').addEventListener('change', carregarSetores);

    const lojas = await (await fetch('/api/lojas')).json();
    const lojaSelect = document.getElementById('lojaSelect');

    lojaSelect.innerHTML = '<option value="">Selecione a Loja</option>';
    lojas.forEach(loja => {
        lojaSelect.innerHTML += `<option value="${loja.id}">${loja.descricao}</option>`;
    });
}

async function carregarSetores() {
    const idLoja = document.getElementById('lojaSelect').value;
    const setorSelect = document.getElementById('setorSelect');

    setorSelect.innerHTML = '<option value="">Selecione o Setor</option>';

    if (!idLoja) return;

    const response = await fetch(`/api/loja/${idLoja}/setores`);
    const setores = await response.json();

    setores.forEach(setor => {
        setorSelect.innerHTML += `<option value="${setor.id}">${setor.descricao}</option>`;
    });
}


// Carregar apenas novidades (1 hora)
async function carregarNovidades() {
    const loja = document.getElementById('lojaSelect').value;
    const setor = document.getElementById('setorSelect').value;
    if (!loja || !setor) return;

    const response = await fetch(`/api/setor/pedidos?loja=${loja}&setor=${setor}`);
    const pedidos = await response.json();

    const container = document.getElementById('novidadesContainer');
    container.innerHTML = '';

    pedidos.forEach(pedido => {
        const chave = pedido.id_produto + '|' + (pedido.observacao || '');

        if (!estadoPedidos[chave]) {
            // Novo Produto
            novidades[chave] = { tipo: 'novo', pedido };
            tocarSom();
        } else if (pedido.quantidade_un > estadoPedidos[chave]) {
            // Incremento de quantidade
            novidades[chave] = { tipo: 'incremento', pedido };
            tocarSom();
        }

        estadoPedidos[chave] = pedido.quantidade_un;
    });

    // Exibir cards de novidades
    Object.values(novidades).forEach(({ tipo, pedido }) => {
        const card = document.createElement('div');
        card.className = 'col-md-3';

        card.innerHTML = `
            <div class="card">
                <div class="${tipo === 'novo' ? 'faixa-azul' : 'faixa-verde'}">
                    ${tipo === 'novo' ? 'Novo Item' : 'Nova Quantidade'}
                </div>
                <h2 class="descricao">${pedido.descricao}</h2>
                <p class="quantidade">${pedido.quantidade_un} un</p>
                ${pedido.observacao ? `<p class="observacao">Obs: ${pedido.observacao}</p>` : ''}
            </div>
        `;

        container.appendChild(card);
    });
}

// Carregar pedidos atuais (60 segundos)
let ultimaAtualizacao = new Date();  // Marca o momento que carregou a tela

async function carregarPedidos() {
    const loja = document.getElementById('lojaSelect').value;
    const setor = document.getElementById('setorSelect').value;
    if (!loja || !setor) return;

    const agora = new Date();

    const response = await fetch(`/api/setor/pedidos?loja=${loja}&setor=${setor}`);
    const pedidos = await response.json();

    const pedidosContainer = document.getElementById('pedidosContainer');
    pedidosContainer.innerHTML = '';

    pedidos.forEach(pedido => {
        const dataCriacao = new Date(pedido.criado_em);

        const card = document.createElement('div');
        card.className = 'col-md-3';

        let faixa = '';
        if (pedido.id_status == 6) {
            faixa = `<div class="faixa-roxa">Balcão</div>`;
        }

        card.innerHTML = `
            <div class="card">
                ${faixa}
                <h2 class="descricao">${pedido.descricao}</h2>
                <p class="quantidade">${pedido.quantidade_un} un</p>
                ${pedido.observacao ? `<p class="observacao">Obs: ${pedido.observacao}</p>` : ''}
            </div>
        `;

        pedidosContainer.appendChild(card);

        // Detecta Novos Produtos
        if (dataCriacao > ultimaAtualizacao) {
            adicionarProdutoNovo(pedido);
            tocarSom();
        }
    });

    ultimaAtualizacao = agora;  // Atualiza a hora de referência
}

function adicionarProdutoNovo(pedido) {
    const containerNovo = document.getElementById('produtosNovos');
    if (!containerNovo) return;

    const agora = new Date();
    const criadoEm = new Date(pedido.criado_em);
    const diferencaHoras = (agora - criadoEm) / (1000 * 60 * 60); // diferença em horas

    const card = document.createElement('div');
    card.className = 'card mb-3';

    // Mantém faixa verde só se menor que 1h
    let faixa = '';
    if (diferencaHoras <= 1) {
        faixa = `<div class="faixa-verde">Novo Produto</div>`;
    }

    card.innerHTML = `
        ${faixa}
        <h2 class="descricao">${pedido.descricao}</h2>
        <p class="quantidade">${pedido.quantidade_un} un</p>
        ${pedido.observacao ? `<p class="observacao">Obs: ${pedido.observacao}</p>` : ''}
    `;

    containerNovo.appendChild(card);
}

function tocarSom() {
    const audio = new Audio('/static/som_alerta.mp3');
    audio.play().catch(err => console.error('Erro ao tocar som:', err));
}

function forcarAtualizacao() {
    const containerNovo = document.getElementById('produtosNovos');
    if (containerNovo) containerNovo.innerHTML = '';

    carregarPedidos();
}



// Tocar som de alerta
function tocarSom() {
    const audio = new Audio('/static/som_alerta.mp3');
    audio.play().catch(err => console.error('Erro ao tocar som:', err));
}

// Inicializar
window.onload = async function() {
    await carregarFiltros();
    carregarNovidades();
    carregarPedidos();

    setInterval(carregarPedidos, 60000); // Atualiza pedidos a cada 60s
    setInterval(carregarNovidades, 3600000); // Atualiza novidades a cada 1h
};
async function carregarSetores() {
    const idLoja = document.getElementById('lojaSelect').value;
    const setorSelect = document.getElementById('setorSelect');

    setorSelect.innerHTML = '<option value="">Selecione o Setor</option>';

    if (!idLoja) return;

    const response = await fetch(`/api/loja/${idLoja}/setores`);
    const setores = await response.json();

    setores.forEach(setor => {
        setorSelect.innerHTML += `<option value="${setor.id}">${setor.descricao}</option>`;
    });
}
function forcarAtualizacao() {
    // ZERA antes de recarregar
    estadoPedidos = {};
    novidades = {};

    carregarPedidos();
    carregarNovidades();
}


</script>

</body>
</html>
