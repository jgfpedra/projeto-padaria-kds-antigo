<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Padaria System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f0f0f0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: white;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 100%;
        max-width: 400px;
      }
      .login-icon {
        width: 70px;
        height: 70px;
        background: #4caf50;
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 30px;
      }
      .form-control {
        background: #f9f9f9;
        border-radius: 10px;
      }
      .btn-login {
        background-color: #4caf50;
        border: none;
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        border-radius: 10px;
        font-size: 18px;
        color: white;
        transition: background-color 0.3s;
      }
      .btn-login:hover {
        background-color: #45a049;
      }
      .forgot-password {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        text-decoration: none;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-icon">
        <i class="fas fa-user"></i>
      </div>
      <form method="POST" action="/login">
        <div class="mb-3 text-start">
          <label class="form-label"
            ><i class="fas fa-envelope"></i> Email</label
          >
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="Digite seu email"
            required
          />
        </div>
        <div class="mb-3 text-start">
          <label class="form-label"><i class="fas fa-lock"></i> Senha</label>
          <input
            type="password"
            name="senha"
            class="form-control"
            placeholder="Digite sua senha"
            required
          />
        </div>
        <button type="submit" class="btn btn-login">Login</button>
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </form>
    </div>
  </body>
</html>
