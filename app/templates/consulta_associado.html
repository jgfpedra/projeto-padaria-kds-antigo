{% extends "layout_base.html" %} {% block title %}Consulta de Vínculos de
Produtos Associados{% endblock %} {% block conteudo_central %}
<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-12 text-start">
      <div class="d-inline-flex" style="gap: 10px">
        <a href="/dashboard_partial" class="btn btn-secondary">Voltar</a>
      </div>
    </div>
  </div>
  <h3>Consulta de Vínculos</h3>
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">Código Produto Principal</label>
      <input type="text" id="filtro_principal" class="form-control" />
      <small id="descricao_principal_filtro" class="text-muted"></small>
    </div>
    <div class="col-md-4">
      <label class="form-label">Código Produto Associado</label>
      <input type="text" id="filtro_opcao" class="form-control" />
      <small id="descricao_opcao_filtro" class="text-muted"></small>
    </div>
    <div class="col-md-4">
      <label class="form-label">Filtrar por Loja</label>
      <select id="filtro_loja" class="form-select">
        <option value="">Todas</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Filtrar por Descrição do Grupo</label>
      <input
        type="text"
        id="filtro_descricao"
        class="form-control"
        placeholder="Digite uma descrição"
      />
    </div>
    <div class="col-md-4 d-flex align-items-end" style="gap: 10px">
      <button class="btn btn-primary flex-fill" onclick="buscarVinculos()">
        Buscar
      </button>
      <button class="btn btn-success flex-fill" onclick="abrirModalAssociado()">
        Novo Associado
      </button>
    </div>
  </div>

  <table class="table table-bordered table-sm">
    <thead>
      <tr>
        <th>ID do Grupo</th>
        <th>Descrição (exibida)</th>
        <th>Loja</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela_resultado"></tbody>
  </table>
</div>

<!-- Modal container -->
<div id="modalAssociadoContainer"></div>

<script>
  function buscarVinculos() {
    const filtroLoja = $("#filtro_loja").val();
    const filtroDesc = $("#filtro_descricao").val().toLowerCase();
    const filtroPrincipal = $("#filtro_principal").val().trim();
    const filtroOpcao = $("#filtro_opcao").val().trim();

    fetch("/api/produto_associado/grupos")
      .then((res) => res.json())
      .then((grupos) => {
        $("#tabela_resultado").html("");
        if (!Array.isArray(grupos)) {
          $("#tabela_resultado").append(`
                    <tr>
                        <td colspan="4" class="text-center text-danger">
                            Erro ao buscar os dados: ${grupos && grupos.erro ? grupos.erro : "Erro inesperado"}
                        </td>
                    </tr>
                `);
          return;
        }

        const gruposFiltrados = grupos
          .filter((grupo) => !filtroLoja || grupo.id_loja == filtroLoja)
          .filter(
            (grupo) =>
              !filtroDesc ||
              (grupo.descricao &&
                grupo.descricao.toLowerCase().includes(filtroDesc)),
          )
          .filter(
            (grupo) =>
              !filtroPrincipal ||
              grupo.produtos_principais.includes(Number(filtroPrincipal)),
          )
          .filter(
            (grupo) =>
              !filtroOpcao ||
              grupo.produtos_associados.includes(Number(filtroOpcao)),
          );

        if (gruposFiltrados.length === 0) {
          $("#tabela_resultado").append(`
                    <tr>
                        <td colspan="4" class="text-center text-danger">Registro não encontrado</td>
                    </tr>
                `);
          return;
        }

        gruposFiltrados.forEach((grupo) => {
          $("#tabela_resultado").append(`
                    <tr>
                        <td>${grupo.id}</td>
                        <td>${grupo.descricao || ""}</td>
                        <td>${grupo.nome_loja || ""}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="abrirModalAssociado(${grupo.id})">Editar</button>
                            <button class="btn btn-sm btn-danger" onclick="excluir(${grupo.id})">Excluir</button>
                        </td>
                    </tr>
                `);
        });
      });
  }

  function buscarDescricao(codigo, target) {
    if (!codigo) {
      $(target).text("");
      return;
    }
    fetch(`/api/produto_vr/${codigo}`)
      .then((res) => res.json())
      .then((data) => {
        $(target).text(data.descricao || "Produto não encontrado");
      })
      .catch(() => $(target).text("Erro ao buscar"));
  }

  $("#filtro_principal").on("change", function () {
    buscarDescricao(this.value, "#descricao_principal_filtro");
  });
  $("#filtro_opcao").on("change", function () {
    buscarDescricao(this.value, "#descricao_opcao_filtro");
  });

  // ABRE MODAL DE CADASTRO/EDIÇÃO DE ASSOCIADO
  function abrirModalAssociado(id = null) {
    fetch(
      id ? `/produto_associado?id=${id}&modal=1` : "/produto_associado?modal=1",
    )
      .then((r) => r.text())
      .then((html) => {
        $("#modalAssociadoContainer").html(html);
        $("#modalAssociado").modal("show");
      });
  }

  function excluir(id) {
    if (!confirm("Deseja realmente excluir esse vínculo?")) return;
    fetch(`/api/produto_associado/excluir/${id}`, { method: "DELETE" }).then(
      (res) => {
        if (res.ok) {
          alert("Vínculo excluído");
          buscarVinculos();
        } else {
          alert("Erro ao excluir");
        }
      },
    );
  }

  function carregarLojasFiltro() {
    fetch("/api/lojas")
      .then((res) => res.json())
      .then((lojas) => {
        lojas.forEach((loja) => {
          $("#filtro_loja").append(
            `<option value="${loja.id}">${loja.descricao}</option>`,
          );
        });
      });
  }

  function consultaAssociadoInit() {
    carregarLojasFiltro();
    buscarVinculos();
  }
  consultaAssociadoInit();
  function abrirModalAssociado(id = null) {
    $("#modalAssociadoContainer").empty();
    fetch(
      id ? `/produto_associado?id=${id}&modal=1` : "/produto_associado?modal=1",
    )
      .then((r) => r.text())
      .then((html) => {
        $("#modalAssociadoContainer").html(html);

        // Aguarda o script do modal carregar (garante execução)
        let tentativas = 0;
        function tentaInicializar() {
          tentativas++;
          // Só tenta se a função já existir
          if (id && typeof carregarGrupoVinculo === "function") {
            carregarGrupoVinculo(id);
            $("#modalAssociado").modal("show");
          } else if (!id && typeof carregarLojasESelecionar === "function") {
            carregarLojasESelecionar();
            $("#modalAssociado").modal("show");
          } else if (tentativas < 20) {
            setTimeout(tentaInicializar, 30); // tenta por até 600ms
          }
        }
        tentaInicializar();
      });
  }
</script>
{% endblock %}
